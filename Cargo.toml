[package]
name = "lau-sheaf-neural"
version = "0.1.0"
edition = "2021"
description = "Sheaf-theoretic neural networks — replacing graph Laplacians with sheaf Laplacians"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-sheaf-neural"
keywords = ["sheaf", "neural-network", "graph", "topology", "gnn"]
categories = ["science", "mathematics"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1"
approx = "0.5"

[dev-dependencies]
proptest = "1"
